# Production reverse proxy: routes the web app, admin app and API behind a
# single origin, terminating TLS is expected to happen upstream (e.g. a load
# balancer) or can be added here with `listen 443 ssl` + certificate paths.
upstream ptg_api {
    server api:3001;
}

upstream ptg_web {
    server web:80;
}

upstream ptg_admin {
    server admin:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://ptg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare observability probes (see apps/api ObservabilityController) stay outside /api/.
    location /health {
        proxy_pass http://ptg_api;
    }

    location /admin/ {
        proxy_pass http://ptg_admin/;
    }

    location / {
        proxy_pass http://ptg_web;
        proxy_set_header Host $host;
    }
}
