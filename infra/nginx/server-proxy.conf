# Single-VM reverse proxy used by docker-compose.server.yml.
#
# Differs from reverse-proxy.conf in one way that matters: the admin console is
# served on its own port instead of under `/admin/`. The admin Vite build has no
# `base: '/admin/'`, so its index.html asks for `/assets/*.js` at the site root -
# which a path-prefixed mount hands to the *web* app. Giving admin its own
# origin keeps both SPAs correct without a base-path change that would also have
# to be threaded through the router.
#
#   :80 and :3000 -> web app  (3000 is kept because it is the port already
#                              proven open end-to-end in the OCI security list)
#   :4000         -> admin console
#
# All three answer /api/, /health and /docs from the same API container, so the
# SPAs talk to a same-origin API and no CORS preflight is involved.

upstream ptg_api {
    server api:3001;
}

upstream ptg_web {
    server web:80;
}

upstream ptg_admin {
    server admin:80;
}

# Media objects live in MinIO, which is not published to the host. Browsers
# reach them through this proxy instead, so S3_PUBLIC_URL points back here.
upstream ptg_media {
    server minio:9000;
}

proxy_http_version 1.1;
client_max_body_size 25m;

server {
    listen 80;
    listen 3000;
    server_name _;

    location /api/ {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Bare observability probes (see apps/api ObservabilityController) and the
    # Swagger UI both sit outside the /api prefix.
    location /health {
        proxy_pass http://ptg_api;
    }

    location /docs {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://ptg_media/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ptg_web;
        proxy_set_header Host $host;
    }
}

server {
    listen 4000;
    server_name _;

    location /api/ {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://ptg_api;
    }

    location /docs {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://ptg_media/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ptg_admin;
        proxy_set_header Host $host;
    }
}
