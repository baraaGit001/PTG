# Single-VM reverse proxy used by docker-compose.server.yml.
#
# Everything PTG serves comes off ONE origin, because only two ports get
# through the OCI security list on this box and AradoBot has the other one:
#
#   /          web app
#   /admin/    admin console
#   /api/      REST API
#   /health    liveness probes   (outside the /api prefix - see main.ts)
#   /docs      Swagger UI        (likewise)
#   /media/    MinIO objects     (MinIO publishes no host port)
#
# One origin also means the SPAs talk to a same-origin API: no CORS preflight
# and no absolute API URL baked into the bundles.
#
# Listening on both 80 and 3000: 3000 is what the VCN actually allows today,
# 80 is bound so the site works the moment an 80 ingress rule is added.
#
# The admin console only works under /admin/ because its bundle is built with
# ADMIN_BASE_PATH=/admin/ (apps/admin/vite.config.ts) - a default-base build
# would ask for /assets/*.js at the site root and get the web app's files.

upstream ptg_api {
    server api:3001;
}

upstream ptg_web {
    server web:80;
}

upstream ptg_admin {
    server admin:80;
}

upstream ptg_media {
    server minio:9000;
}

proxy_http_version 1.1;
client_max_body_size 25m;

server {
    listen 80;
    listen 3000;
    server_name _;

    location /api/ {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://ptg_api;
    }

    location /docs {
        proxy_pass http://ptg_api;
        proxy_set_header Host $host;
    }

    # Without this, /admin (no trailing slash) misses the location below and
    # falls through to the web app's SPA fallback.
    location = /admin {
        return 301 /admin/;
    }

    # The trailing slash on proxy_pass strips the /admin prefix, so the admin
    # container sees /users, /assets/x.js, ... exactly as it would on its own
    # origin. The bundle asks for /admin/assets/*, which lands back here.
    location /admin/ {
        proxy_pass http://ptg_admin/;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://ptg_media/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ptg_web;
        proxy_set_header Host $host;
    }
}
