services:
  postgres:
    image: postgres:16-alpine
    container_name: ptg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ptg}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ptg} -d ${POSTGRES_DB:-ptg}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ptg-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: ptg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ptg_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ptg_minio_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-ptg_minio} ${S3_SECRET_KEY:-ptg_minio_password};
      mc mb --ignore-existing local/${S3_BUCKET:-ptg-media};
      mc anonymous set download local/${S3_BUCKET:-ptg-media};
      exit 0;"

volumes:
  pgdata:
  redisdata:
  miniodata:
