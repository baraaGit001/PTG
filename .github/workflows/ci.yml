name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://ptg:ptg_test_password@localhost:5432/ptg_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-access-secret-at-least-32-chars
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
  COOKIE_SECRET: ci-test-cookie-secret-16
  VITE_API_URL: http://localhost:3001/api/v1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ptg
          POSTGRES_PASSWORD: ptg_test_password
          POSTGRES_DB: ptg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ptg -d ptg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ptg/api exec prisma generate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Deploy test database migrations
        run: pnpm --filter @ptg/api exec prisma migrate deploy

      - name: Unit & integration tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
